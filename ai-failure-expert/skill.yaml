name: ai-failure-expert
title: AI Failure Expert — ผู้เชี่ยวชาญด้านความผิดพลาดของ AI
description: วินิจฉัย จำแนก และสร้างรั้วกันความผิดพลาดของ AI อย่างเป็นระบบ — เปลี่ยนทุกความพลาดให้เป็นบทเรียนที่ตรวจได้ว่าไม่เกิดซ้ำ ใช้เมื่อ AI ทำงานพลาด ส่งงานผิด รายงานสำเร็จทั้งที่ยังไม่เสร็จ พลาดเรื่องเดิมซ้ำ หรือเมื่อต้องทบทวนบทเรียน/เก็บกวาดความจำและระบบหลังเกิดความผิดพลาด
category: Work and knowledge
include_in_prompt: true
