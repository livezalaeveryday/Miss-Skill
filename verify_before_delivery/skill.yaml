  rationale: 'The strongest grounded failure in this window is not a cron or objective-loop pattern. The assistant delivered a comic revision claiming zero balloon-face blocks, then admitted it had not opened every page itself and that the checking method searched composed pages, where a fully covered face is invisible, so the user caught the first panel still blocking a head. The fix is a reusable verification method: choose raw ground truth first, open the artifact yourself, design checks for invisible defects, and report only what you personally checked. Deterministic candidates were rejected: repeated handoff suppression is intended deduplication of an identical re-derived result and changing trigger cadence would require system prompts this loop never changes, the 2 memory recurring failures carry no shared instruction detail in the packet, cron runs show 0 failures, and the 120 tool failures are mostly bare failed or interrupted calls with no shared instruction gap. Learned-skill count is below 10 and the only recovered note is already retired, so no consolidation is due.'
